<div class="page" style="display:block;max-width:1100px">
  <div class="photo-hero">
    <h1 class="section-title">Photography</h1>
    <p>Shot across Washington DC, Seoul, Tokyo and Shanghai.</p>
    <p class="photo-count"><span id="total-count">0 photos</span> · <span id="category-list"></span></p>
  </div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-filter="all" onclick="filterGallery('all', this)">All</button>
    <!-- Category buttons are injected by JS based on PHOTOS data -->
    <button class="filter-btn shuffle-btn" id="shuffle-btn" onclick="shuffleGallery()">
      <svg id="shuffle-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:5px"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>Shuffle
    </button>
  </div>

  <div class="masonry" id="masonry"></div>
  <div class="empty-state" id="empty-state">
    <p>No photos in this category yet.</p>
  </div>
</div>

<footer>
  <div class="nav-inner">© 2026 Andre Arante</div>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="lbClickOutside(event)">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" onclick="lbNav(-1)">‹</button>
  <button class="lb-nav lb-next" id="lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-img-wrap">
    <img id="lb-img" src="" alt="">
  </div>
  <div class="lb-caption">
    <div class="lb-caption-left">
      <span class="lb-caption-title" id="lb-title"></span><br>
      <span class="lb-caption-meta" id="lb-meta"></span>
    </div>
    <span class="lb-counter" id="lb-counter"></span>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   PHOTO DATA
   ═══════════════════════════════════════════════
   HOW TO ADD YOUR OWN PHOTOS:
   Replace the placeholder entries below with real ones.
   Each photo object:
   {
     src:      "photos/my-shot.jpg",   ← path to your image file
     title:    "Golden Hour",          ← shown on hover + lightbox caption
     location: "Washington, DC",       ← shown in lightbox caption
     category: "Street",               ← must match one of the filter buttons
   }
   ═══════════════════════════════════════════════ */

const PHOTOS = [
  { src: 'photography/DSC09709 2.JPG',  title: 'Trains in Motion I',  location: 'Tokyo Tower', category: 'Night' },
  { src: 'photography/DSC09710 2.JPG',  title: 'Trains in Motion I',  location: 'Tokyo Tower', category: 'Night' },

  { src: 'photography/DSC09852 2.JPG',  title: 'Sashimi II',  location: 'Ginza, Tokyo', category: 'Animals' },

  { src: 'photography/DSC09895 2.JPG',  title: 'Aquarium Date',  location: 'Ginza, Tokyo', category: 'Street' },
  { src: 'photography/DSC09909 2.JPG',  title: 'Sashimi III',  location: 'Ginza, Tokyo', category: 'Animals' },

  { src: 'photography/IMG_0075 2.JPG',  title: 'IMG_0075',  location: 'Washington, DC', category: 'Street' },
  { src: 'photography/IMG_0088 2.JPG',  title: 'IMG_0088',  location: 'Washington, DC', category: 'Street' },
  { src: 'photography/IMG_0131 2.JPG',  title: 'IMG_0131',  location: 'Washington, DC', category: 'Street' },
  { src: 'photography/IMG_0133 2.JPG',  title: 'IMG_0133',  location: 'Washington, DC', category: 'Street' },

  { src: 'photography/IMG_4137 4.jpg',  title: 'IMG_4137 (2)', location: 'Washington, DC', category: 'Street' },
  { src: 'photography/IMG_4516 2.JPG',  title: 'IMG_4516',  location: 'Washington, DC', category: 'Street' },
  { src: 'photography/Image 2.jpg',     title: 'Trains in Motion III',     location: 'Tokyo', category: 'Train' },
  { src: 'photography/P1020233 2.JPG',  title: 'P1020233',  location: 'Washington, DC', category: 'Street' },

  { src: 'photography/P1050630 2.JPG',  title: 'P1050630',  location: 'Washington, DC', category: 'Street' },
  { src: 'photography/P1050644 2.JPG',  title: 'P1050644',  location: 'Washington, DC', category: 'Street' },
];

/* ── Build category list from data ── */
const categories = ['all', ...new Set(PHOTOS.map(p => p.category))];

/* Inject filter buttons */
const filterBar = document.getElementById('filter-bar');
categories.slice(1).forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.filter = cat;
  btn.textContent = cat;
  btn.onclick = () => filterGallery(cat, btn);
  filterBar.insertBefore(btn, document.getElementById('shuffle-btn'));
});

/* Update photo count and category list */
document.getElementById('total-count').textContent = PHOTOS.length + ' photos';
document.getElementById('category-list').textContent = categories.slice(1).join(' · ');

/* ── Build grid ── */
const masonry = document.getElementById('masonry');
let currentFilter = 'all';

PHOTOS.forEach((photo, i) => {
  const item = document.createElement('div');
  item.className = 'photo-item';
  item.dataset.category = photo.category;
  item.dataset.index = i;
  item.onclick = () => openLightbox(i);

  item.innerHTML = `
    <img src="${photo.src}" alt="${photo.title}" loading="lazy">
    <div class="photo-overlay">
      <div class="photo-overlay-title">${photo.title}</div>
      <div class="photo-overlay-meta">${[photo.category, photo.location].filter(Boolean).join(' · ')}</div>
    </div>`;

  masonry.appendChild(item);
});

/* ── Filter ── */
function filterGallery(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const items = document.querySelectorAll('.photo-item');
  let visible = 0;
  items.forEach(item => {
    const match = cat === 'all' || item.dataset.category === cat;
    item.classList.toggle('hidden', !match);
    if (match) visible++;
  });

  document.getElementById('empty-state').classList.toggle('visible', visible === 0);
}

/* ── Lightbox ── */
let lbIndex = 0;
let lbFiltered = [];

function getFilteredPhotos() {
  return currentFilter === 'all'
    ? PHOTOS
    : PHOTOS.filter(p => p.category === currentFilter);
}

function openLightbox(globalIdx) {
  lbFiltered = getFilteredPhotos();
  const photo = PHOTOS[globalIdx];
  lbIndex = lbFiltered.indexOf(photo);
  if (lbIndex === -1) { lbFiltered = PHOTOS; lbIndex = globalIdx; }
  renderLightbox();
  document.getElementById('lightbox').classList.add('active');
}

function renderLightbox() {
  const photo = lbFiltered[lbIndex];
  const img = document.getElementById('lb-img');
  img.src = photo.src;
  img.alt = photo.title;

  document.getElementById('lb-title').textContent = photo.title;
  document.getElementById('lb-meta').textContent = [photo.category, photo.location].filter(Boolean).join(' · ');
  document.getElementById('lb-counter').textContent = `${lbIndex + 1} / ${lbFiltered.length}`;
  document.getElementById('lb-prev').disabled = lbIndex === 0;
  document.getElementById('lb-next').disabled = lbIndex === lbFiltered.length - 1;
}

function lbNav(dir) {
  const next = lbIndex + dir;
  if (next < 0 || next >= lbFiltered.length) return;
  lbIndex = next;
  renderLightbox();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}

function lbClickOutside(e) {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
}

document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (!lb.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});

/* ── Shuffle ── */
function shuffleGallery() {
  const icon = document.getElementById('shuffle-icon');
  const masonry = document.getElementById('masonry');
  const items = Array.from(masonry.querySelectorAll('.photo-item'));

  icon.classList.remove('spinning');
  void icon.offsetWidth;
  icon.classList.add('spinning');
  setTimeout(() => icon.classList.remove('spinning'), 450);

  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    masonry.insertBefore(items[j], items[i]);
    [items[i], items[j]] = [items[j], items[i]];
  }
}
</script>
